<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2132" />
      <stop offset="1" stop-color="#151a27" />
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#3b82f6" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#64748b" />
    </marker>
    <style>
      .t { font-family: Segoe UI, Inter, Arial, sans-serif; }
      .title { font-size: 26px; font-weight: 700; fill: #f1f5f9; }
      .sub { font-size: 13px; fill: #94a3b8; }
      .stepTitle { font-size: 14.5px; font-weight: 700; fill: #e2e8f0; }
      .stepSub { font-size: 11.5px; fill: #93a3b8; }
      .num { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .foot { font-size: 12px; fill: #7c8aa3; }
    </style>
  </defs>

  <rect width="1200" height="430" fill="url(#page)" />
  <text x="44" y="56" class="t title">From rough idea to a review-ready prompt</text>
  <text x="44" y="82" class="t sub">One panel, six steps, no configuration files to hand-edit.</text>

  <g class="t">
    <g transform="translate(44 128)">
      <rect width="164" height="184" rx="12" fill="url(#step)" stroke="#2b3446" />
      <circle cx="30" cy="34" r="16" fill="url(#num)" />
      <text x="30" y="39.5" class="num" text-anchor="middle">1</text>
      <text x="56" y="39" class="stepTitle">Install</text>
      <text x="20" y="86" class="stepSub">Search “Universal AI</text>
      <text x="20" y="104" class="stepSub">Prompt Engineer” in the</text>
      <text x="20" y="122" class="stepSub">Extensions view.</text>
      <text x="20" y="156" class="stepSub" fill="#7c8aa3">marketplace / .vsix</text>
    </g>

    <g transform="translate(230 128)">
      <rect width="164" height="184" rx="12" fill="url(#step)" stroke="#2b3446" />
      <circle cx="30" cy="34" r="16" fill="url(#num)" />
      <text x="30" y="39.5" class="num" text-anchor="middle">2</text>
      <text x="56" y="39" class="stepTitle">Connect</text>
      <text x="20" y="86" class="stepSub">Enter endpoint, model</text>
      <text x="20" y="104" class="stepSub">and your API key, then</text>
      <text x="20" y="122" class="stepSub">Save provider settings.</text>
      <text x="20" y="156" class="stepSub" fill="#7c8aa3">key → SecretStorage</text>
    </g>

    <g transform="translate(416 128)">
      <rect width="164" height="184" rx="12" fill="url(#step)" stroke="#2b3446" />
      <circle cx="30" cy="34" r="16" fill="url(#num)" />
      <text x="30" y="39.5" class="num" text-anchor="middle">3</text>
      <text x="56" y="39" class="stepTitle">Describe</text>
      <text x="20" y="86" class="stepSub">Paste the rough prompt</text>
      <text x="20" y="104" class="stepSub">you would normally send</text>
      <text x="20" y="122" class="stepSub">to a chat assistant.</text>
      <text x="20" y="156" class="stepSub" fill="#7c8aa3">selection or clipboard</text>
    </g>

    <g transform="translate(602 128)">
      <rect width="164" height="184" rx="12" fill="url(#step)" stroke="#2b3446" />
      <circle cx="30" cy="34" r="16" fill="url(#num)" />
      <text x="30" y="39.5" class="num" text-anchor="middle">4</text>
      <text x="56" y="39" class="stepTitle">Pick a mode</text>
      <text x="20" y="86" class="stepSub">Nine modes from Quick</text>
      <text x="20" y="104" class="stepSub">Enhance to Autonomous</text>
      <text x="20" y="122" class="stepSub">Agent.</text>
      <text x="20" y="156" class="stepSub" fill="#7c8aa3">Ctrl+Enter to run</text>
    </g>

    <g transform="translate(788 128)">
      <rect width="164" height="184" rx="12" fill="url(#step)" stroke="#2b3446" />
      <circle cx="30" cy="34" r="16" fill="url(#num)" />
      <text x="30" y="39.5" class="num" text-anchor="middle">5</text>
      <text x="56" y="39" class="stepTitle">Enhance</text>
      <text x="20" y="86" class="stepSub">One HTTPS request to</text>
      <text x="20" y="104" class="stepSub">the provider you chose.</text>
      <text x="20" y="122" class="stepSub">90 s timeout.</text>
      <text x="20" y="156" class="stepSub" fill="#7c8aa3">result in seconds</text>
    </g>

    <g transform="translate(974 128)">
      <rect width="164" height="184" rx="12" fill="url(#step)" stroke="#2b3446" />
      <circle cx="30" cy="34" r="16" fill="url(#num)" />
      <text x="30" y="39.5" class="num" text-anchor="middle">6</text>
      <text x="56" y="39" class="stepTitle">Use it</text>
      <text x="20" y="86" class="stepSub">Copy into Copilot Chat,</text>
      <text x="20" y="104" class="stepSub">Claude, Cursor or any</text>
      <text x="20" y="122" class="stepSub">coding agent.</text>
      <text x="20" y="156" class="stepSub" fill="#7c8aa3">panel · copy · replace</text>
    </g>
  </g>

  <g stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M208 220h16" />
    <path d="M394 220h16" />
    <path d="M580 220h16" />
    <path d="M766 220h16" />
    <path d="M952 220h16" />
  </g>

  <text x="44" y="366" class="t foot">Tip: every step is also available from the Command Palette — type “AI Prompt Engineer” to see all 14 commands.</text>
  <text x="44" y="390" class="t foot">Your prompt text leaves your machine only through the HTTPS endpoint you configure.</text>
</svg>
